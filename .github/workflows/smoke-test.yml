name: Smoke Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  test:
    name: Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Java 8 is for running tests
          # Java 17 is listed last so it becomes JAVA_HOME, which builds the SDK.
          java-version: |
            8
            17
          cache: 'maven'

      # Pinned Docker Engine version for the Testcontainers-based integration tests.
      # Don't remove or bump without checking the integration tests still pass.
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v28.5.1
          set-host: true

      - name: run package tests
        run: ./mvnw clean package --batch-mode --no-transfer-progress -Dmaven.javadoc.skip=true -Djvm=${JAVA_HOME_8_X64}/bin/java

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-results
          path: '**/surefire-reports/**'
          retention-days: 7

      - name: Publish test results
        if: ${{ !cancelled() }}
        run: |
          curl https://raw.githubusercontent.com/couchbaselabs/junit-markdown/refs/heads/main/JunitMarkdown.java --output ${{ runner.temp }}/JunitMarkdown.java
          java ${{ runner.temp }}/JunitMarkdown.java . >> $GITHUB_STEP_SUMMARY
